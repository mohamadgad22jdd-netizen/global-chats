<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت جهانی</title>
<style>
:root{--bg:#0b0b0b;--panel:#151412;--gold:#d4af37;--gold2:#f5d76e;--text:#f3ead0;--mute:#8a7f5c}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#1d1808,#0b0b0b 60%);color:var(--text);font-family:Tahoma,system-ui,sans-serif}
.page{display:none;height:100%}.page.on{display:flex}
#signup{flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.desc{color:var(--gold2);font-size:15px;max-width:320px;line-height:1.9}
.desc b{font-size:20px;display:block}
.oval{width:min(300px,100%);padding:14px 22px;border-radius:999px;border:1.5px solid var(--gold);background:#111;color:var(--text);font-size:16px;text-align:center;outline:none;font-family:inherit}
.oval:focus{box-shadow:0 0 14px #d4af3766}
.sq{width:120px;height:56px;border-radius:4px;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}
#chat{flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid #3a3116}
header h1{margin:0;font-size:17px;color:var(--gold2)}
header small{color:var(--mute)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:#1d1b16;border:1px solid #2e2911;align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#3b3010,#5a4715);border-color:var(--gold)}
.m .n{font-size:12px;color:var(--gold);margin-bottom:2px}
.m .t{font-size:10px;color:var(--mute);margin-top:3px;text-align:left}
.bar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid #3a3116}
.bar .oval{flex:1;text-align:right;padding:12px 18px}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-size:18px;cursor:pointer}
.note{color:var(--mute);font-size:12px;padding:8px 14px}
</style>
</head>
<body>
<section id="signup" class="page on">
  <div class="desc"><b>🌍 سایت چت جهانی ❤️</b>اینجا همه‌ی ثبت‌نامی‌ها با هم توی یک گروه گپ می‌زنن.</div>
  <input id="nameIn" class="oval" maxlength="24" placeholder="اسمت رو بنویس" autocomplete="off">
  <button id="go" class="sq">ثبت نام</button>
</section>
<section id="chat" class="page">
  <header><h1>💛 چت جهانی</h1><small id="cnt"></small></header>
  <div id="note" class="note" style="display:none"></div>
  <div id="msgs"></div>
  <div class="bar">
    <input id="txt" class="oval" maxlength="500" placeholder="پیام بنویس..." autocomplete="off">
    <button id="send" class="send">➤</button>
  </div>
</section>
<script>
const $=id=>document.getElementById(id);
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let myName="",cid=st("gc_cid");
if(!cid){cid=Math.random().toString(36).slice(2)+Date.now().toString(36);st("gc_cid",cid)}
let ws=null,started=false;
function show(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id))}
function note(t){const n=$("note");n.textContent=t;n.style.display=t?"block":"none"}
function add(m){
  const box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  const el=document.createElement("div");el.className="m"+(m.cid===cid?" me":"");
  const n=document.createElement("div");n.className="n";n.textContent=m.name;
  const b=document.createElement("div");b.textContent=m.text;
  const t=document.createElement("div");t.className="t";
  t.textContent=new Date(m.ts).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  el.append(n,b,t);box.append(el);
  if(near||m.cid===cid)box.scrollTop=box.scrollHeight;
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=()=>note("");
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==="history"){$("msgs").textContent="";d.msgs.forEach(add);$("msgs").scrollTop=$("msgs").scrollHeight}
    else if(d.type==="msg")add(d.m);
    else if(d.type==="count")$("cnt").textContent=d.n+" آنلاین";
  };
  ws.onclose=()=>{note("اتصال قطع شد؛ در حال اتصال دوباره...");setTimeout(connect,2000)};
}
function startChat(){show("chat");if(!started){started=true;connect()}}
function send(){
  const txt=$("txt").value.trim();
  if(!txt||!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify({name:myName,text:txt,cid}));
  $("txt").value="";
}
$("go").onclick=()=>{const n=$("nameIn").value.trim();if(!n){$("nameIn").focus();return}myName=n;st("gc_name",n);startChat()};
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("send").onclick=send;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
const saved=st("gc_name");if(saved){myName=saved;startChat()}
</script>
</body>
</html>
